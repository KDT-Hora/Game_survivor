# Terrain Survivor バランス・設定データ(仕様書 §17 の仮設定)。
# 値はプレイテストで調整する。ソースコードに数値を直書きしない。

# ---- 基本 ----
tile.size = 32
game.duration = 600          # 生存目標(秒)。この時間でボス出現
game.step = 0.0166667        # 固定ステップ(秒)

# ---- マップ ----
